name: Release Client

on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      config-args: ${{ steps.check.outputs.config-args }}
    steps:
      - name: Detect alpha/beta tags
        id: check
        run: |
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta)[0-9]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "config-args=--config src-tauri/tauri.beta.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "config-args=" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
            rust-targets: ''
            tauri-args: ''
            binary: nooto

          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            rust-targets: ''
            tauri-args: ''
            binary: nooto

          - runner: macos-latest
            os: macos
            arch: universal
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'
            binary: nooto

          - runner: windows-latest
            os: windows
            arch: x86_64
            rust-targets: ''
            tauri-args: ''
            binary: nooto.exe

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          prefix-key: client

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nooto ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          projectPath: client
          args: ${{ matrix.tauri-args }} ${{ needs.prepare.outputs.config-args }}

      - name: Create binary archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            BIN_PATH="target/universal-apple-darwin/release/${{ matrix.binary }}"
          else
            BIN_PATH="target/release/${{ matrix.binary }}"
          fi
          ARCHIVE="nooto-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN_PATH")" "$(basename "$BIN_PATH")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: ${{ env.ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Align SDK path with the F-Droid buildserver
        run: |
          sudo ln -sfn "$ANDROID_HOME" /opt/android-sdk
          sudo mkdir -p /cargo
          sudo chown "$USER" /cargo
          echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup NDK toolchain wrappers
        run: |
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          for TRIPLE in aarch64-linux-android; do
            ln -sf $NDK_BIN/llvm-ranlib $NDK_BIN/$TRIPLE-ranlib
            ln -sf $NDK_BIN/llvm-ar     $NDK_BIN/$TRIPLE-ar
          done
          echo "$NDK_BIN" >> $GITHUB_PATH

      - name: Compute SOURCE_DATE_EPOCH
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=$epoch"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: setup Android signing
        working-directory: client
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build Android AAB
        working-directory: client
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          CARGO_HOME: /cargo
          CARGO_TARGET_DIR: /tmp/build
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$PWD=/build"
          npm run tauri android build -- --apk --split-per-abi --target aarch64 ${{ needs.prepare.outputs.config-args }}

      - name: Find APK artifacts
        run: |
          find client/src-tauri/gen/android -name "*.apk" | tee apk-paths.txt
          echo "APK_FILES=$(cat apk-paths.txt | tr '\n' ',' | sed 's/,$//')" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nooto-android-arm64
          path: client/src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Nooto ${{ github.ref_name }}'
          body: 'See the assets below to download and install this version.'
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: ${{ env.APK_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


